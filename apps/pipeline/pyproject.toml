[project]
name = "edmar-pipeline"
version = "0.1.0"
description = "EdMar content factory — extraction, generation, validation (§13)"
requires-python = ">=3.11"
dependencies = [
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
edmar-pipeline = "edmar_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
